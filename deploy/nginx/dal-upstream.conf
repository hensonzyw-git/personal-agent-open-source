# DAL-R08 ECS baseline: shared upstream settings for the /dal/ locations of
# agent.example.invalid. Installed to /etc/nginx/snippets/dal-upstream.conf.
# Unlike the Finance API (Unix socket, www-data boundary), the DAL service
# listens on 127.0.0.1:8820, loopback-only; Nginx is the only local client
# because no other local user has a reason to reach the port and the listener
# is bound to the loopback address itself.

proxy_pass http://127.0.0.1:8820;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";

# Operator/worker endpoints are short JSON exchanges; the 202/poll paths
# return immediately. Bound it like every other proxy_read_timeout here.
proxy_read_timeout 30s;
