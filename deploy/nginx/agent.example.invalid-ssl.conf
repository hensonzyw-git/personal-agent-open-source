# DEV-033: the TLS half of agent.example.invalid.
#
# Installed to /etc/nginx/sites-available/agent.example.invalid-ssl ONLY AFTER
# `certbot certonly --nginx -d agent.example.invalid` has issued the certificate:
# the ssl_certificate paths below must exist or nginx -t fails. The rate
# zones, log format and Origin map are defined in agent.example.invalid.conf
# (the port-80 half), which is always installed first.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.example.invalid;

    ssl_certificate     /etc/letsencrypt/live/agent.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.example.invalid/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # JSON endpoints retain their text-sized limit.
    client_max_body_size 64k;

    access_log /var/log/nginx/agent.example.invalid.access.log pa_api;
    error_log  /var/log/nginx/agent.example.invalid.error.log;

    if ($pa_origin_ok = 0) { return 403; }

    # Internal DAL authority is available only through the signed local bridge.
    location = /internal { return 403; }
    location ^~ /internal/ { return 403; }
    location = /dal/transport/v1/internal { return 403; }
    location ^~ /dal/transport/v1/internal/ { return 403; }

    # Workflow object bundles are bounded at both proxy and application layers.
    location /dal/transport/v1/workflow/ {
        client_max_body_size 3m;
        limit_req zone=pa_poll burst=30 nodelay;
        include /etc/nginx/snippets/dal-upstream.conf;
    }

    location /dal/transport/v1/jobs/ {
        limit_req zone=pa_poll burst=30 nodelay;
        include /etc/nginx/snippets/dal-upstream.conf;
    }

    location /dal/transport/v1/ {
        limit_req zone=pa_auth burst=3 nodelay;
        include /etc/nginx/snippets/dal-upstream.conf;
    }

    location = /v1/enrollments/claim {
        limit_req zone=pa_auth burst=3 nodelay;
        include /etc/nginx/snippets/pa-upstream.conf;
    }

    location /v1/auth/ {
        limit_req zone=pa_auth burst=3 nodelay;
        include /etc/nginx/snippets/pa-upstream.conf;
    }

    location /v1/chat/ {
        limit_req zone=pa_chat burst=5 nodelay;
        include /etc/nginx/snippets/pa-upstream.conf;
    }

    # Stream photo bytes to the authenticated bounded receiver without disk buffering.
    location /v1/media/content/ {
        client_max_body_size 5m;
        proxy_request_buffering off;
        limit_req zone=pa_default burst=10 nodelay;
        include /etc/nginx/snippets/pa-upstream.conf;
    }

    location /v1/operations/ {
        limit_req zone=pa_poll burst=30 nodelay;
        include /etc/nginx/snippets/pa-upstream.conf;
    }

    location / {
        limit_req zone=pa_default burst=10 nodelay;
        include /etc/nginx/snippets/pa-upstream.conf;
    }
}
