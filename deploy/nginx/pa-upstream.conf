# DEV-033: shared upstream settings for every agent.example.invalid location.
# Installed to /etc/nginx/snippets/pa-upstream.conf.
# The socket directory (/run/personal-agent, 0770 api:www-data) is the real
# access boundary; uvicorn hardcodes the socket itself to 0666.

proxy_pass http://unix:/run/personal-agent/api.sock;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection "";

# A synchronous chat answer bounds one full model turn; 202/poll paths return
# immediately, so this only ever matters for the sync path.
proxy_read_timeout 75s;
