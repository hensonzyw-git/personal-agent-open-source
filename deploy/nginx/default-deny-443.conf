# DEV-033: refuse unknown Hosts on 443.
#
# Port 80 already refuses them (sites-enabled/default-deny, 444). Port 443
# previously fell through to the first ssl block, which answered unknown names
# with the personal site's certificate and content. ssl_reject_handshake
# (nginx >= 1.19.4) aborts the TLS handshake before any certificate or content
# is served; SNI-correct traffic to zhuyawei.com and agent.example.invalid is
# unaffected.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
