# DEV-033: agent.example.invalid — the only public entry to personal-agent-api.
# Upstream is the DEV-032 Unix socket. MCP, databases and /mcp get no public
# path; unknown Hosts are refused by default-deny (port 80, existing) and
# default-deny-443 (this rollout).
#
# Installed to /etc/nginx/sites-available/agent.example.invalid, symlinked into
# sites-enabled. limit_req_zone / log_format / map live in the http context,
# which is where sites-enabled files are included.

# --- Rate zones (technical design 10.3: enrollment, token, chat, poll split) ---
# Enrollment/auth is the only unauthenticated surface — tightest allowance.
limit_req_zone $binary_remote_addr zone=pa_auth:10m    rate=6r/m;
limit_req_zone $binary_remote_addr zone=pa_chat:10m    rate=20r/m;
limit_req_zone $binary_remote_addr zone=pa_poll:10m    rate=120r/m;
limit_req_zone $binary_remote_addr zone=pa_default:10m rate=60r/m;
limit_req_status 429;

# --- Access log without the query string ---
# The default combined format logs $request, which includes the query (history
# cursors). Design 10.3: Nginx must not record sensitive fields in the query;
# Authorization is a header and never reaches any stock log format.
log_format pa_api '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

# --- Origin check ---
# The only client is the native iOS app, which sends no Origin header. A
# present Origin means a browser, and this API has no browser client.
map $http_origin $pa_origin_ok {
    default 0;
    ""      1;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.example.invalid;

    # certbot --nginx edits this block temporarily for the HTTP-01 challenge.
    # Nothing else is served on plain HTTP, not even a redirect: the only
    # client is the app, and it only ever speaks TLS.
    location / { return 444; }
}

# The 443 server for this vhost lives in agent.example.invalid-ssl.conf, which is
# installed only after certbot issuance: it references certificate files that
# do not exist before then, and nginx -t would fail on them.
