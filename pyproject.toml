[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Henson's single-user Personal Agent backend and Personal Data MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "fastapi>=0.139,<1",
  "uvicorn>=0.51,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.18,<2",
  "httpx>=0.28,<1",
  "httpx2>=2.5,<3",
  "cryptography>=49,<50",
  "pyjwt>=2.13,<3",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.23,<5",
  "h2>=4,<5",
]

[project.optional-dependencies]
adk = [
  # Upgrade only after the locked ADK behavior gate is rerun.
  "google-adk==2.5.0",
  "litellm>=1.83,<1.92",
  "tokenizers==0.23.1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
personal-agent-api = "personal_agent.cli:main"
personal-agent-review = "personal_agent.review_cli:main"
risk-monitor-daily = "risk_monitor.daily_cli:main"
risk-monitor-db = "risk_monitor.db_cli:main"
personal-agent-cleanup = "personal_agent.cleanup_cli:main"
personal-agent-device = "personal_agent.device_cli:main"
personal-agent-db = "personal_agent.storage.db:main"
personal-agent-dal-db = "personal_agent_dal.storage.db:main"
personal-agent-export-deletion-manifest = "personal_agent.backup.export_cli:main"
personal-agent-media-backup-bundle = "personal_agent.backup.media_bundle_cli:main"
personal-agent-restore-verify = "personal_agent.backup.restore_cli:main"
personal-agent-generate-contracts = "personal_agent_core.manifest:main"
personal-agent-write-switch = "personal_agent_core.write_switch_cli:main"
personal-agent-fault-breakpoint = "personal_agent_core.fault_breakpoint_cli:main"
personal-agent-eval-lint = "personal_agent_core.evalset:main"
personal-agent-eval-score = "personal_agent_core.evalset:score_main"
personal-agent-model-eval = "personal_agent.eval_cli:main"
personal-data-mcp = "personal_data_mcp.cli:main"
personal-data-mcp-db = "personal_data_mcp.storage.db:main"
personal-data-mcp-ledger = "personal_data_mcp.finance.onboarding:main"
personal-data-mcp-freeze-ledger = "personal_data_mcp.finance.config_freeze:main"
personal-data-mcp-verify-ledger = "personal_data_mcp.finance.verify_ledger_cli:main"
personal-data-mcp-write-expense = "personal_data_mcp.finance.write_expense_cli:main"
personal-data-mcp-probe = "personal_data_mcp.feishu.connectivity:main"
personal-data-mcp-observe = "personal_data_mcp.observe_cli:main"
personal-agent-offline-eval = "personal_agent_spike.offline_eval:main"
personal-agent-mcp-probe = "personal_agent_spike.client_probe:main"
personal-agent-framework-probe = "personal_agent_spike.framework_probe:main"
personal-agent-online-eval = "personal_agent_spike.online_eval:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/personal_agent",
  "src/personal_agent_core",
  "src/personal_agent_dal",
  "src/personal_data_mcp",
  "src/personal_agent_spike",
  "src/risk_monitor",
]

[tool.hatch.build.targets.wheel.force-include]
"evals/finance_v0.2.jsonl" = "personal_agent_core/data/finance_v0.2.jsonl"
"spec/scoring_policy.yml" = "risk_monitor/scoring/scoring_policy.yml"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "tests", "scripts"]
testpaths = ["tests"]
